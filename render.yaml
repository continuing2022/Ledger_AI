services:
  - type: web
    name: ledger-ai-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: qwen
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen3.6-plus
      - key: QWEN_TEMPERATURE
        value: "1"
      - key: QWEN_API_KEY
        sync: false
      - key: ALIYUN_OSS_REGION
        sync: false
      - key: ALIYUN_OSS_ENDPOINT
        sync: false
      - key: ALIYUN_OSS_BUCKET
        sync: false
      - key: ALIYUN_OSS_ACCESS_KEY_ID
        sync: false
      - key: ALIYUN_OSS_ACCESS_KEY_SECRET
        sync: false
